name: Flutter Build APK & AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        # Vraciame najnovšiu verziu pre podporu parametra 'spacing' a nového NDK
        channel: 'stable'

    - name: Link files for build compatibility
      run: |
        cp lib/app_config.dart lib/app.dart
        cp lib/backend_service.dart lib/backend.dart
        cp lib/firebase_auth_service.dart lib/firebase_auth.dart
        cp lib/balance_service.dart lib/balance.dart

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --target-platform android-arm64 --android-skip-build-dependency-validation

    - name: Build AAB (pre Google Play)
      run: flutter build appbundle --android-skip-build-dependency-validation

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: storyfund-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: storyfund-aab
        path: build/app/outputs/bundle/release/app-release.aab
